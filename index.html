<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>변경관리 개인 업무대장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">Q</div>
      <div><strong>변경관리 업무대장</strong><small>개인 업무 추적 · 누락 방지 · 진행 모니터링</small></div>
    </div>
    <div class="top-actions">
      <button class="btn btn-light" id="exportBackup">백업 내보내기</button>
      <label class="btn btn-light file-label">백업 불러오기<input type="file" id="importBackup" accept=".json,application/json"></label>
      <button class="btn btn-primary" id="newChangeBtn">＋ 변경 등록</button>
    </div>
  </header>

  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">PERSONAL CHANGE CONTROL</p>
        <h1>변경 업무를 놓치지 않고,<br><span>끝까지 추적하세요.</span></h1>
        <p class="intro-copy">변경 등록부터 영향 평가, 완료 보고, 문서 배포 및 수령 확인까지 한 곳에서 관리합니다.</p>
      </div>
      <div class="intro-note"><span class="pulse"></span> 이 브라우저에 자동 저장됩니다 <small>중요한 기록은 정기적으로 백업 파일을 내려받으세요.</small></div>
    </section>

    <section class="stats" id="stats"></section>

    <section class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-view="dashboard">업무 현황</button>
        <button class="tab" data-view="changes">변경관리대장</button>
        <button class="tab" data-view="followups">확인 필요 업무</button>
      </div>
      <div class="filters">
        <input id="searchInput" type="search" placeholder="변경번호, 제목, 담당자 검색">
        <select id="statusFilter">
          <option value="">전체 진행상태</option>
          <option>등록</option><option>영향 평가</option><option>승인 대기</option>
          <option>변경 실행</option><option>완료 보고</option><option>문서 배포</option><option>완료</option><option>보류</option>
        </select>
      </div>
    </section>

    <section id="dashboardView" class="view"></section>
    <section id="changesView" class="view hidden"></section>
    <section id="followupsView" class="view hidden"></section>
  </main>

  <dialog id="changeDialog" class="modal">
    <form id="changeForm" method="dialog">
      <div class="modal-head">
        <div><p class="eyebrow">CHANGE RECORD</p><h2 id="dialogTitle">변경 등록</h2></div>
        <button type="button" class="icon-btn" id="closeDialog" aria-label="닫기">✕</button>
      </div>
      <input type="hidden" id="changeId">
      <div class="form-grid">
        <label>변경 제목 <b>*</b><input id="title" required placeholder="예: 원재료 공급업체 변경"></label>
        <label>변경 유형
          <select id="type"><option>제품</option><option>공정</option><option>원자재</option><option>공급업체</option><option>설비</option><option>시험·검사</option><option>문서</option><option>시스템</option><option>기타</option></select>
        </label>
        <label>요청자 / 관련자<input id="requester" placeholder="이름 또는 부서"></label>
        <label>목표 완료일<input id="dueDate" type="date"></label>
        <label>변경 중요도
          <select id="grade"><option>일반</option><option>중요</option><option>긴급</option></select>
        </label>
        <label>진행 상태
          <select id="status"><option>등록</option><option>영향 평가</option><option>승인 대기</option><option>변경 실행</option><option>완료 보고</option><option>문서 배포</option><option>완료</option><option>보류</option></select>
        </label>
        <label class="full">변경 사유 및 목적<textarea id="reason" rows="3" placeholder="변경이 필요한 배경과 목적"></textarea></label>
        <label class="full">변경 전 / 변경 후 내용<textarea id="description" rows="4" placeholder="변경 전·후 내용을 구체적으로 기록"></textarea></label>
        <label class="full">메모 및 다음 조치<textarea id="memo" rows="3" placeholder="다음에 확인할 사항, 연락 내용, 지연 사유 등"></textarea></label>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-light" id="cancelDialog">취소</button><button class="btn btn-primary" type="submit">저장</button></div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="modal detail-modal">
    <div id="detailContent"></div>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
